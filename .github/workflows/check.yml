name: Library checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# packages: read is the most verify.yml's job declares; a caller that grants less
# makes the reusable workflow invalid. Nothing is installed from GitHub Packages.
permissions:
  contents: read
  packages: read
# Jobs run on GitHub-hosted ubuntu-latest (verify.yml's default runner). The
# repository is public: keep the runner input unset, since a pull request from
# a fork chooses the code it runs.
concurrency:
  group: checks-${{ github.ref }}
  # A newer push to a pull request supersedes its older run; every main commit
  # keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The same gate as the pre-push hook. It adds --release (no unreleased
  # changelog entries, docs/VERSIONING.md) for main and pull requests into main;
  # dev and branches run plain verify.
  check:
    uses: maxvyshniakov/package-kit/.github/workflows/verify.yml@v1.0.0
    with:
      timeout-minutes: 15
