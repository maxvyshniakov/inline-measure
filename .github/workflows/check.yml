name: Library checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# packages: read is the most verify.yml's job declares; a caller that grants less
# makes the reusable workflow invalid. Nothing is installed from GitHub Packages.
permissions:
  contents: read
  packages: read
# Jobs run on GitHub-hosted ubuntu-latest (verify.yml's default runner). The
# repository is public: keep the runner input unset, since a pull request from
# a fork chooses the code it runs.
concurrency:
  group: checks-${{ github.ref }}
  # A newer push to a pull request supersedes its older run; every main commit
  # keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The same gate as the pre-push hook. It adds --release (no unreleased
  # changelog entries, docs/VERSIONING.md) for main and pull requests into main;
  # dev and branches run plain verify.
  check:
    uses: maxvyshniakov/package-kit/.github/workflows/verify.yml@v1.0.1
    with:
      timeout-minutes: 15
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxvyshniakov/package-kit/actions/setup-bun@v1.0.1
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run check:browser --browser chromium
      - run: bun run check:browser --browser firefox --bundled-firefox
      - run: bun run check:browser --browser webkit
      - run: bun run verify:fonts --bundled-firefox
      - run: bun run verify:boxes --bundled-firefox
      - run: bun run perf:test
      - run: bun run perf:check-ratios --strict
